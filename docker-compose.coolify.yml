# Despliegue en Coolify: extiende docker-compose.yml con variables de producción.
# Guía completa: docs/CUTOVER_PRODUCTION.md

services:
  backend:
    environment:
      CORS_ORIGIN: ${COOLIFY_FQDN:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-excel-uploads}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CRON_SECRET: ${CRON_SECRET}

  frontend:
    environment:
      USE_OWN_BACKEND: "true"
      NEXT_PUBLIC_USE_OWN_BACKEND: "true"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:4000/v1}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      NEXT_PUBLIC_SITE_URL: ${COOLIFY_FQDN:-http://localhost:3000}

  etl-worker:
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      NEXT_INTERNAL_URL: ${NEXT_INTERNAL_URL:-http://frontend:3000}
      INTERNAL_ETL_SECRET: ${CRON_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

  excel-worker:
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      NEXT_INTERNAL_URL: ${NEXT_INTERNAL_URL:-http://frontend:3000}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
